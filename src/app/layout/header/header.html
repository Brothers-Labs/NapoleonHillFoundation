<header class="header" [class.is-scrolled]="isScrolled()">
  <div class="header__inner nh-container nh-container--wide">
    <a
      class="header__brand"
      routerLink="/"
      aria-label="The Napoleon Hill Foundation Brasil, página inicial"
    >
      <nh-brand-mark />
    </a>

    <nav class="header__nav" aria-label="Navegação principal">
      <ul class="header__list">
        @for (entry of navigation; track entry.id) {
          <li>
            @switch (entry.kind) {
              @case ('link') {
                <a
                  class="header__link"
                  [class.is-active]="activeIds().has(entry.id)"
                  [routerLink]="entry.route"
                  [attr.aria-current]="currentPath() === entry.route ? 'page' : null"
                >
                  {{ entry.label }}
                </a>
              }
              @case ('group') {
                <div class="header__group">
                  <button
                    type="button"
                    class="header__link header__group-toggle"
                    [class.is-active]="activeIds().has(entry.id)"
                    [attr.aria-expanded]="openGroupId() === entry.id"
                    [attr.aria-controls]="'header-group-' + entry.id"
                    (click)="toggleGroup(entry.id)"
                  >
                    {{ entry.label }}
                    <nh-icon name="chevron-down" />
                  </button>
                  <ul
                    class="header__submenu"
                    [id]="'header-group-' + entry.id"
                    [class.is-open]="openGroupId() === entry.id"
                  >
                    @for (child of entry.children; track child.id) {
                      <li>
                        <a
                          class="header__submenu-link"
                          [routerLink]="child.route"
                          [attr.aria-current]="currentPath() === child.route ? 'page' : null"
                          (click)="closeGroup()"
                        >
                          {{ child.label }}
                        </a>
                      </li>
                    }
                  </ul>
                </div>
              }
            }
          </li>
        }
      </ul>
    </nav>

    <div class="header__actions">
      <a class="nh-button nh-button--outline header__cta" [routerLink]="callToAction.route">
        {{ callToAction.label }}
      </a>
      <button
        type="button"
        class="header__menu-toggle"
        aria-label="Abrir menu"
        aria-haspopup="dialog"
        [attr.aria-expanded]="isMenuOpen()"
        (click)="isMenuOpen.set(true)"
      >
        <span class="header__menu-line"></span>
        <span class="header__menu-line"></span>
      </button>
    </div>
  </div>
</header>

<nh-mobile-menu [(open)]="isMenuOpen" />
